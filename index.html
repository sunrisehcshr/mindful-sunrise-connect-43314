
<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunrise Human Care Services</title>
    <meta name="author" content="Sunrise Human Care Services INC" />
    
    <!-- Geo-targeting tags -->
    <meta name="geo.region" content="US-PA" />
    <meta name="geo.placename" content="Darby" />
    <meta name="geo.position" content="39.9184;-75.2590" />
    <meta name="ICBM" content="39.9184, -75.2590" />
    <meta name="language" content="English" />
    
    <!-- hreflang tags -->
    <link rel="alternate" hreflang="en-us" href="https://sunrisehumancare.com/" />

    <!-- Critical CSS inline for above-the-fold content -->
    <style>
      /* Basic critical styles for quick rendering */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(145deg, #fffdd0, #fef9a7, #ffeeb1);
        text-rendering: optimizeSpeed;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
        background: linear-gradient(145deg, #fffdd0, #fef9a7, #ffeeb1);
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(236, 177, 66, 0.2);
        border-radius: 50%;
        border-top-color: #F7913E;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    
    <!-- Font loading optimized with correct attributes -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Open+Sans:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <div id="root">
      <!-- Loading spinner shown until React loads -->
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>
    
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    
    <!-- Google Analytics - load async with minimal blocking -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L46C72W6FN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L46C72W6FN', { 
        'send_page_view': false,
        'cookie_domain': 'sunrisehumancare.com',
        'cookie_flags': 'SameSite=None;Secure',
        'geo_granularity': 'city',
        'region_code': 'US-PA'  
      });
      // Defer sending pageview until after page loads
      window.addEventListener('load', function() {
        gtag('event', 'page_view', {
          'page_location': window.location.href,
          'page_path': window.location.pathname,
          'page_title': document.title,
          'region_code': 'US-PA'
        });
      });
    </script>
    
    <!-- Main application script - defer loading -->
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
