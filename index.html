
<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- All meta tags (title, description, canonical, OG, Twitter, geo) are managed per-page by react-helmet-async via SEOHead component -->
    <title>Sunrise Human Care Services</title>

    <!-- Critical CSS inline for above-the-fold content -->
    <style>
      /* Basic critical styles for quick rendering */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(145deg, #fffdd0, #fef9a7, #ffeeb1);
        text-rendering: optimizeSpeed;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
        background: linear-gradient(145deg, #fffdd0, #fef9a7, #ffeeb1);
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(236, 177, 66, 0.2);
        border-radius: 50%;
        border-top-color: #F7913E;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    
    <!-- Font loading optimized: preload critical font, defer others -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Open+Sans:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Open+Sans:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Open+Sans:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" />
    </noscript>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured data is injected by React components (SEOHead + SchemaMarkup) -->
    <!-- Prerender.io serves fully-rendered HTML with schemas to search bots -->
  </head>

  <body>
    <div id="root">
      <!-- Loading spinner shown until React loads -->
      <div class="loading">
        <div class="spinner"></div>
      </div>
      <!-- SEO: Visible content for crawlers that don't execute JavaScript -->
      <noscript>
        <h1>Sunrise Human Care Services — Mental Health Therapy in Darby, PA</h1>
        <p>Sunrise Human Care Services provides expert mental health care in Darby, Pennsylvania. Our licensed therapists and psychiatrists offer treatment for anxiety, depression, ADHD, trauma/PTSD, OCD, bipolar disorder, and more.</p>
        <p>Services: Individual Therapy, Couples Counseling, Family Therapy, Child &amp; Adolescent Therapy, Psychiatric Evaluations, Medication Management, IBHS Services</p>
        <p>Address: 869 Main Street, Darby, PA 19023 | Phone: (814) 620-2162</p>
        <p>We accept Medicaid and most insurance plans. In-person and telehealth sessions available.</p>
        <p><a href="https://sunrisehumancare.com/appointment">Schedule an Appointment</a> | <a href="https://sunrisehumancare.com/services">Our Services</a> | <a href="https://sunrisehumancare.com/contact">Contact Us</a></p>
      </noscript>
    </div>
    
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    
    <!-- Google Analytics - load async with minimal blocking -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L46C72W6FN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L46C72W6FN', { 
        'send_page_view': false,
        'cookie_domain': 'sunrisehumancare.com',
        'cookie_flags': 'SameSite=None;Secure',
        'geo_granularity': 'city',
        'region_code': 'US-PA'  
      });
      // Defer sending pageview until after page loads
      window.addEventListener('load', function() {
        gtag('event', 'page_view', {
          'page_location': window.location.href,
          'page_path': window.location.pathname,
          'page_title': document.title,
          'region_code': 'US-PA'
        });
      });
    </script>
    
    <!-- Main application script - defer loading -->
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
