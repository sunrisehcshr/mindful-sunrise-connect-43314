<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mental Health Clinic in Havertown, PA</title>
    <meta name="description" content="Mental health services for children, teens, adults, and seniors in Havertown, PA. Expert therapy for anxiety, depression, and well-being." />
    <meta name="author" content="Sunrise Human Care Services INC" />
    
    <!-- Geo-targeting tags -->
    <meta name="geo.region" content="US-PA" />
    <meta name="geo.placename" content="Havertown" />
    <meta name="geo.position" content="39.9707;-75.3151" />
    <meta name="ICBM" content="39.9707, -75.3151" />
    <meta name="language" content="English" />
    
    <!-- hreflang tags -->
    <link rel="alternate" hreflang="en-us" href="https://sunrisehumancare.com/" />
    <link rel="canonical" href="https://sunrisehumancare.com/" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    
    <!-- Critical CSS inlined -->
    <style>
      /* Critical CSS for fast initial render */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(145deg, #fffdd0, #fef9a7, #ffeeb1);
        text-rendering: optimizeSpeed;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
        background: linear-gradient(145deg, #fffdd0, #fef9a7, #ffeeb1);
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(236, 177, 66, 0.2);
        border-radius: 50%;
        border-top-color: #c2410c;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/images/family-counseling-havertown.webp" as="image" fetchpriority="high" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />
    
    <!-- Font loading optimized -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    
    <!-- Non-critical CSS loaded asynchronously -->
    <link rel="stylesheet" href="/src/index.css" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root">
      <!-- Loading spinner shown until React loads -->
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>
    
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module" defer></script>
    
    <!-- Main application script - with type="module" and defer -->
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
