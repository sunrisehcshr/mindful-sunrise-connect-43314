name: Deploy Vite React App

on:
  push:
    branches:
      - main  # Change this if your branch is different (e.g., "master")

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy (Optional)
        run: echo "Add your deployment steps here (e.g., upload to GitHub Pages or a server)"
