[build]
  publish = "dist"
  command = "npm run build"

# Prerender.io integration — handled via edge function (prerender.ts)
# Requires PRERENDER_TOKEN environment variable to be set in Netlify dashboard

# Custom headers for SEO and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/lovable-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Sitemap and robots should not be cached long
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain"

# Blog redirects (must be ABOVE the SPA catch-all)
[[redirects]]
  from = "/resources"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/resources/*"
  to = "/blog/:splat"
  status = 301

# SPA redirect - let client-side routing handle all paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
